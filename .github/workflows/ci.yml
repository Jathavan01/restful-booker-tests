# Runs the full test suite on GitHub's servers whenever code is pushed.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button so you can start a run by hand

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repo's code onto the runner
      - name: Check out code
        uses: actions/checkout@v4

      # Install Java 17 (same version as your machine); caching Maven speeds up later runs
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -B = batch mode, which keeps the log clean in CI
      - name: Run tests
        run: mvn -B test

      # Keep the test result files even when a test fails, so you can inspect them
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports